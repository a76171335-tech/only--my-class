<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리반 금융 & 3D 교실 (Minimal Beta)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #fafafa; color: #18181b; }
    .nav-pill-active { background-color: #18181b; color: #ffffff; }
    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 9999px; }
    .pixel-art { image-rendering: pixelated; image-rendering: crisp-edges; }
    #threeContainer canvas { display: block; border-radius: 1rem; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-zinc-900 selection:text-white">

  <!-- Minimalist Sticky Header -->
  <header class="bg-white/90 backdrop-blur-md border-b border-zinc-200/80 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-zinc-900 text-white flex items-center justify-center font-bold text-sm">₩</div>
        <span class="font-extrabold text-base tracking-tight text-zinc-900">우리반 금융</span>
        <span class="hidden sm:inline-block text-[10px] font-semibold px-2 py-0.5 rounded-full bg-zinc-100 text-zinc-500">BETA</span>
      </div>

      <div class="flex items-center gap-2">
        <div class="flex items-center bg-zinc-100 rounded-lg px-2 py-1">
          <select id="classSelect" onchange="switchClass(this.value)" class="bg-transparent text-xs font-bold text-zinc-800 focus:outline-none cursor-pointer"></select>
          <button onclick="openNewClassModal()" title="새 반 추가" class="ml-1.5 w-5 h-5 rounded bg-white text-zinc-700 hover:bg-zinc-200 flex items-center justify-center text-xs font-bold shadow-2xs">+</button>
        </div>

        <div class="flex items-center bg-zinc-100 rounded-lg px-2.5 py-1">
          <select id="activeUserSelect" onchange="switchActiveUser(this.value)" class="bg-transparent text-xs font-bold text-zinc-900 focus:outline-none cursor-pointer"></select>
        </div>

        <button onclick="resetAllDemoData()" title="초기화" class="p-1.5 text-zinc-400 hover:text-zinc-900 transition">
          <i data-lucide="rotate-ccw" class="w-3
